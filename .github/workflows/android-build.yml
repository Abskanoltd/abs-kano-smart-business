name: Build ABS KANO Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets with local Supabase library
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx esbuild supabase-entry.js --bundle --format=iife --outfile=www/supabase.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2#./supabase.js#' www/index.html
          test -s www/supabase.js

      - name: Add Android platform
        run: npx cap add android

      - name: Add native Android receipt printing
        run: |
          mkdir -p android/app/src/main/java/com/abskanoltd/smartbusiness
          cat > android/app/src/main/java/com/abskanoltd/smartbusiness/MainActivity.java <<'EOF'
          package com.abskanoltd.smartbusiness;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              registerPlugin(NativePrintPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cat > android/app/src/main/java/com/abskanoltd/smartbusiness/NativePrintPlugin.java <<'EOF'
          package com.abskanoltd.smartbusiness;
          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.concurrent.atomic.AtomicBoolean;
          @CapacitorPlugin(name = "NativePrint")
          public class NativePrintPlugin extends Plugin {
            private WebView printWebView;
            @PluginMethod public void print(PluginCall call) {
              final String html = call.getString("html");
              final String title = call.getString("title", "ABS KANO Receipt");
              if (html == null || html.trim().isEmpty()) { call.reject("Receipt content is empty"); return; }
              getActivity().runOnUiThread(() -> {
                try {
                  printWebView = new WebView(getContext());
                  printWebView.getSettings().setJavaScriptEnabled(false);
                  AtomicBoolean started = new AtomicBoolean(false);
                  printWebView.setWebViewClient(new WebViewClient() {
                    @Override public void onPageFinished(WebView view, String url) {
                      if (!started.compareAndSet(false, true)) return;
                      try {
                        PrintManager manager = (PrintManager) getContext().getSystemService(Context.PRINT_SERVICE);
                        if (manager == null) throw new IllegalStateException("Android print service is unavailable");
                        PrintAttributes attributes = new PrintAttributes.Builder()
                          .setColorMode(PrintAttributes.COLOR_MODE_COLOR)
                          .setMediaSize(PrintAttributes.MediaSize.UNKNOWN_PORTRAIT)
                          .build();
                        manager.print(title, view.createPrintDocumentAdapter(title), attributes);
                        call.resolve();
                      } catch (Exception error) { call.reject("Could not open Android print dialog", error); }
                    }
                  });
                  printWebView.loadDataWithBaseURL("https://localhost/", html, "text/html", "UTF-8", null);
                } catch (Exception error) { call.reject("Could not prepare receipt for printing", error); }
              });
            }
          }
          EOF
      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABS-KANO-Smart-Business-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
