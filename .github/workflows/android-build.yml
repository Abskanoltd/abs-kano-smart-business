name: Build ABS KANO Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate app JavaScript syntax
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(x=>x[1]).filter(Boolean);const app=scripts.find(s=>s.includes('signInWithPassword'));if(!app)throw new Error('App script not found');fs.writeFileSync('/tmp/abs-app.js',app)"
          node --check /tmp/abs-app.js
      - name: Install dependencies
        run: npm install

      - name: Prepare web assets with local Supabase library
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx esbuild supabase-entry.js --bundle --format=iife --outfile=www/supabase.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2#./supabase.js#' www/index.html
          test -s www/supabase.js

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABS-KANO-Smart-Business-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
